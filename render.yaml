services:
  - type: web
    name: nexus-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,https://nexus-kappa-three-48.vercel.app
